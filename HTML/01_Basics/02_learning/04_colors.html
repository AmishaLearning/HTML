<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formatting</title>
    <link rel="stylesheet" href="04_colors_styling.css">
    <style>
        body{
            color: blueviolet;
        }
    </style>
</head>
<body>
    <h1>Formatting</h1>
    <h1>Formatting</h1>
    <p> This is <b>Important</b></p>
    <p> This is <strong>Important</strong></p>
    <p>This is <i>Italics</i></p>
    <p>This is <em>Italics</em></p>

    <ul>
        <li>b ; strong</li>
        <li>i, em</li>
        <li>sub, sup</li>
        <li>del, mark</li>
    </ul>

    <p> H20</p>
    <p> H<sub>2</sub>0</p>
    <p>x<sup>2</sup> + y<sup>2</sup> = z<sup>2</sup></p>

    <p>There is <del>nothing</del></p>
    <p>This is <mark>Huge</mark></p>

    <h3 
    style = 
    "text-align: center; 
    background-color: rgba(14, 63, 225, 0.7);
    "
    >This section needs styling</h3>

    <p>
        <blockquote cite = "#">
            This is a quote
        </blockquote>
        <q>
            This is a quotation
        </q><br/>
        <abbr title="Hyper Text Markup Language">HTML</abbr><br/>
        <bdo dir="rtl">Amisha</bdo>
    </p>
</body>
</html>
